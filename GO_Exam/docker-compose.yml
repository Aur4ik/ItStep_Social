services:

  # ─── База данных ────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: go_exam_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"         # порт наружу (чтобы можно было подключиться из DBeaver/pgAdmin)
    volumes:
      - postgres_data:/var/lib/postgresql/data   # данные сохраняются между перезапусками
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── Приложение ─────────────────────────────────────────────────────────────
  app:
    build: .                # собирает из Dockerfile в текущей папке
    container_name: go_exam_app
    restart: always
    ports:
      - "8080:8080"
    env_file:
      - .env                # берёт переменные из твоего .env файла
    environment:
      DB_HOST: db           # имя сервиса выше — Docker сам резолвит в IP
    volumes:
      - ./uploads:/app/uploads   # аватарки сохраняются на твоём компьютере
    depends_on:
      db:
        condition: service_healthy   # ждёт пока БД будет готова

volumes:
  postgres_data:
